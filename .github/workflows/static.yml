# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0  # IndexNow step diffs against the pre-push commit
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5.0.0
      # linkedin_posts.json is hand-edited; rebuild the feed so it never ships stale
      - name: Build RSS feed
        run: python3 .github/scripts/news_feed.py
      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3.0.1
        with:
          # Upload entire repository except build scripts
          path: '.'
          exclude: |
            **/*.py
            **/*.sh
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4.0.5
      # Tells Bing/Yandex/Seznam (and Bing-backed AI search) which pages changed.
      # Key file lives at /<key>.txt; never fails the deploy.
      - name: Ping IndexNow
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
          KEY: 613c30caebb8cab5a6d70daf7f0b161b
        run: |
          base="$BEFORE"
          git cat-file -e "${base}^{commit}" 2>/dev/null || base=HEAD~1  # workflow_dispatch / force push
          urls=$(git diff --name-only --diff-filter=AMR "$base" HEAD -- '*.html' \
            | grep -vE '(^|/)(_build|do-work)/' \
            | sed -E 's#(^|/)index\.html$#\1#; s#^#https://lorenzmaierhofer.com/#' \
            | jq -R . | jq -sc .)
          [ "$urls" = "[]" ] && { echo "No HTML changed"; exit 0; }
          echo "$urls"
          jq -n --arg k "$KEY" --argjson u "$urls" \
            '{host:"lorenzmaierhofer.com", key:$k, keyLocation:"https://lorenzmaierhofer.com/\($k).txt", urlList:$u}' \
            | curl -sS -o /dev/null -w 'IndexNow HTTP %{http_code}\n' -X POST https://api.indexnow.org/indexnow \
                -H 'Content-Type: application/json; charset=utf-8' --data-binary @-
