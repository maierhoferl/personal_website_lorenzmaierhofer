# Weekly: collect new AI-related items from approved official P&G sources,
# publish verbatim excerpts to pg_ai_news.json, and redeploy the site.
name: P&G AI News

on:
  schedule:
    - cron: "0 6 * * 1"  # Mondays 06:00 UTC
    - cron: "0 6 * * 4"  # Thursday catch-up: pages skipped by an outage Monday are retried
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: pg-ai-news
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35  # a stalled model call once hung the job for 6h; script stops new pages at 12 min
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          persist-credentials: false  # the write token is only handed to the push below

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        # exact pin: 3.0 defaults to API v1, which lacks the -latest aliases, and a new
        # release never runs with the repo write token unreviewed. Bump by hand.
        run: pip install --retries 5 --timeout 30 "google-genai==2.34.0"

      - name: Validator self-check
        run: python3 .github/scripts/test_pg_ai_news.py

      - name: Collect P&G AI news
        id: collect
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          SEC_USER_AGENT: ${{ vars.SEC_USER_AGENT }}
          PG_NEWS_REPORT: ${{ runner.temp }}/pg_news_report.md
        run: python3 .github/scripts/pg_ai_news.py

      # Runs even when the collect step fails (a source broken two weeks running),
      # so items from the healthy sources still publish.
      - name: Commit and deploy
        id: commit
        if: always() && steps.collect.outcome != 'cancelled'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          python3 .github/scripts/news_feed.py
          git add pg_ai_news.json .github/pg_ai_news_seen.json news.xml
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          news_changed=$(git diff --cached --name-only | grep -c '^pg_ai_news.json$' || true)
          git commit -m "chore(news): weekly P&G AI news update"
          remote="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          # main may have moved during the run: rebase and retry instead of losing the update
          for i in 1 2 3; do
            git pull --rebase "$remote" main && git push "$remote" HEAD:main && break
            [ "$i" = 3 ] && exit 1
            sleep 15
          done
          # Pushes made with GITHUB_TOKEN do not trigger on: push, so start the deploy explicitly.
          if [ "$news_changed" = "1" ]; then
            gh workflow run static.yml --ref main || { sleep 30; gh workflow run static.yml --ref main; }
          fi

      # Email notification: GitHub mails the assignee when the issue is opened.
      - name: Notify about published items
        if: always() && steps.commit.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f "$RUNNER_TEMP/pg_news_report.md" ] || { echo "Nothing published."; exit 0; }
          n=$(grep -c '^### ' "$RUNNER_TEMP/pg_news_report.md")
          gh issue create \
            --title "P&G AI News: $n new item(s) published $(date -u +%F)" \
            --body-file "$RUNNER_TEMP/pg_news_report.md" \
            --assignee "${{ github.repository_owner }}"
